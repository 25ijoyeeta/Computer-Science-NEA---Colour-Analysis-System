<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/styling/style.css">
</head>

<body>
    <h1>Sign In</h1>
    <form action="dashboard.html" method="post">

        <label for="username">Username:</label>
        <div>
            <input type="text" id="username" name="username" placeholder="Username" required maxlength="12">
        </div>

        <br>
        <label for="password">Password:</label>
        <div>
            <input type="password" id="password" name="password" placeholder="Password" required maxlength="12">
        </div>
    
    <br>
    <div>Don't have an account? <a href="register.html">Register</a></div>

    <br>
    <div>
        <button type = "Submit">Submit</button>
    </div>

    <div>
        <button><a href="dashboard.html">continue</a></button>
    </div>

    </form>
</body>

</html>
