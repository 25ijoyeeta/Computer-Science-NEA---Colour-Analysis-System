<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="/styling/style.css">
</head>

<body>
    <h1>Registration</h1>
    <form action="dashboard.html" method="post">

        <label for="email">Email:</label> 
        <div>
            <input type="email" id="email" name="email" placeholder="Email" required>
        </div>

        <br>
        <label for="username">Username:</label>
        <div>
            <input type="text" id="username" name="username" placeholder="Username" required maxlength="12">
        </div>


        <br>
        <label for="password">Password:</label>
        <div>
            <input type="password" id="password" name="password" placeholder="Password" required maxlength="12">
        </div>
    
    <br>
    <div>Already have an account? <a href="signin.html">Sign in</a></div>

    <br>
    <div>
        <input type="reset" value="Reset">
    </div>

    <br>
    <div>
        <button type = "Submit">Submit</button>
    </div>

    <br>
    <div>
        <a href="dashboard.html">continue</a>
    </div>

    </form>
</body>

</html>
